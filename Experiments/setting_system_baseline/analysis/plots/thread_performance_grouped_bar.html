<!DOCTYPE html>
<html>
  <head><meta charset="UTF-8"></head>
  <body>
    <div style="padding: 1rem 0;">
  <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 16px; font-size: 12px; color: var(--color-text-secondary);">
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #378ADD;"></span>FPS</span>
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #D85A30;"></span>Latency (ms)</span>
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #1D9E75;"></span>Threads</span>
    <span style="display: flex; align-items: center; gap: 4px;"><span style="width: 10px; height: 10px; border-radius: 2px; background: #7F77DD;"></span>Running threads</span>
  </div>
  <div style="position: relative; width: 100%; height: 420px;">
    <canvas id="threadChart"></canvas>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const labels = ['Default','1 thread','2 threads','3 threads','4 threads','5 threads','6 threads','7 threads','8 threads','9 threads','10 threads'];
const fps =     [2.785, 2.836, 3.508, 4.010, 4.302, 3.812, 2.176, 3.613, 3.552, 3.402, 3.392];
const latency = [366.821, 357.308, 288.130, 258.616, 234.305, 267.858, 285.549, 279.668, 283.706, 295.977, 297.440];
const threads = [19.981, 11.989, 14.697, 17.980, 21.424, 22.805, 24.272, 25.790, 27.198, 28.754, 30.274];
const running = [1.718, 1.724, 2.343, 2.540, 2.766, 2.097, 2.097, 2.231, 2.354, 2.371, 2.515];

new Chart(document.getElementById('threadChart'), {
  type: 'bar',
  data: {
    labels,
    datasets: [
      {
        label: 'FPS',
        data: fps,
        backgroundColor: '#378ADD',
        borderRadius: 3,
        yAxisID: 'yFPS'
      },
      {
        label: 'Latency (ms)',
        data: latency,
        backgroundColor: '#D85A30',
        borderRadius: 3,
        yAxisID: 'yLatency'
      },
      {
        label: 'Threads',
        data: threads,
        backgroundColor: '#1D9E75',
        borderRadius: 3,
        yAxisID: 'yThreads'
      },
      {
        label: 'Running threads',
        data: running,
        backgroundColor: '#7F77DD',
        borderRadius: 3,
        yAxisID: 'yRunning'
      }
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: {
        callbacks: {
          label: ctx => {
            const v = ctx.parsed.y;
            if (ctx.dataset.label === 'Latency (ms)') return ` Latency: ${v.toFixed(3)} ms`;
            if (ctx.dataset.label === 'FPS') return ` FPS: ${v.toFixed(3)}`;
            if (ctx.dataset.label === 'Threads') return ` Threads: ${v.toFixed(3)}`;
            return ` Running threads: ${v.toFixed(3)}`;
          }
        }
      }
    },
    scales: {
      x: {
        ticks: { autoSkip: false, maxRotation: 35, font: { size: 11 } },
        grid: { color: 'rgba(128,128,128,0.1)' }
      },
      yFPS: {
        type: 'linear',
        position: 'left',
        title: { display: true, text: 'FPS', font: { size: 11 }, color: '#378ADD' },
        ticks: { color: '#378ADD', font: { size: 10 } },
        grid: { color: 'rgba(128,128,128,0.1)' },
        min: 0,
        max: 7
      },
      yLatency: {
        type: 'linear',
        position: 'right',
        title: { display: true, text: 'Latency (ms)', font: { size: 11 }, color: '#D85A30' },
        ticks: { color: '#D85A30', font: { size: 10 } },
        grid: { drawOnChartArea: false },
        min: 0,
        max: 500
      },
      yThreads: {
        type: 'linear',
        position: 'left',
        title: { display: false },
        ticks: { display: false },
        grid: { drawOnChartArea: false },
        min: 0,
        max: 50
      },
      yRunning: {
        type: 'linear',
        position: 'right',
        title: { display: false },
        ticks: { display: false },
        grid: { drawOnChartArea: false },
        min: 0,
        max: 10
      }
    }
  }
});
</script>

  </body>
</html>
